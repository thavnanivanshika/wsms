# ===== Server =====
server.port=8080

# ===== Application =====
spring.application.name=wsms-backend

# ===== H2 in-memory database =====
spring.datasource.url=jdbc:h2:mem:wsmsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== JWT =====
# Override in production. Must be at least 32 bytes for HS256.
wsms.jwt.secret=${JWT_SECRET:change-this-dev-secret-please-change-in-production-0123456789}
wsms.jwt.expiration-ms=86400000

# ===== Eligibility defaults (role-based max purchase value) =====
wsms.eligibility.user-max=5000
wsms.eligibility.manager-max=20000

# ===== Mail (real SMTP) =====
# Provide these via environment variables. If MAIL_USERNAME is blank, email sends are
# skipped (logged only) so the workflow still succeeds in dev/offline.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
wsms.mail.from=${MAIL_FROM:no-reply@wsms.local}

# ===== Seed users (for demo) =====
wsms.seed.manager.username=manager
wsms.seed.manager.email=${SEED_MANAGER_EMAIL:manager@wsms.local}
wsms.seed.manager.password=manager123
wsms.seed.user.username=user
wsms.seed.user.email=${SEED_USER_EMAIL:user@wsms.local}
wsms.seed.user.password=user123

logging.level.com.wsms=INFO
